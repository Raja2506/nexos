services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: nexos
      POSTGRES_PASSWORD: nexos_pass
      POSTGRES_DB: nexos_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://nexos:nexos_pass@postgres:5432/nexos_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data: